<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Método Missão | Gabarita Aí</title>

    <style>
        :root {
            --cor-fundo-site: #02112e;
            --cor-fundo-bloco: #031842;
            --cor-borda: #0b2c6e;
            --cor-ouro: #ffca28;
            --cor-texto: #ffffff;
            --cor-sucesso: #2ecc71;
            --cor-erro: #ff5252;
            --cor-texto-mutado: #8a99ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cor-fundo-site);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .badge-missao {
            background-color: var(--cor-fundo-bloco);
            border: 2px solid var(--cor-ouro);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 800;
            color: var(--cor-ouro);
            display: block;
            width: fit-content;
            margin: 0 auto 24px auto;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card {
            background-color: var(--cor-fundo-bloco);
            border: 2px solid var(--cor-borda);
            border-radius: 12px;
            padding: 28px 24px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitulo {
            font-size: 13px;
            color: var(--cor-texto-mutado);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.45;
        }

        .aviso-cadastro {
            display: none;
            background: rgba(255, 202, 40, 0.1);
            border: 1px solid rgba(255, 202, 40, 0.4);
            color: #ffe082;
            font-size: 12px;
            line-height: 1.45;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            text-align: left;
        }

        .aviso-cadastro strong {
            color: #ffffff;
        }

        label {
            font-size: 13px;
            color: var(--cor-texto-mutado);
            display: block;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid var(--cor-borda);
            background-color: var(--cor-fundo-site);
            color: var(--cor-texto);
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--cor-ouro);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 22px;
        }

        .btn-entrar {
            background-color: var(--cor-ouro);
            color: var(--cor-fundo-site);
        }

        .btn-entrar:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .btn-cadastrar {
            background-color: transparent;
            border: 2px solid var(--cor-borda);
            color: var(--cor-texto);
            margin-top: 10px;
        }

        .mensagem {
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            min-height: 16px;
            line-height: 1.45;
        }

        .mensagem.erro {
            color: var(--cor-erro);
        }

        .mensagem.sucesso {
            color: var(--cor-sucesso);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge-missao">Método Missão</div>

        <div class="card">
            <h1 id="titulo">Acesse sua conta</h1>
            <p class="subtitulo" id="subtitulo">Entre com seu e-mail e senha</p>

            <div class="aviso-cadastro" id="aviso-cadastro">
                ⚠️ <strong>Importante:</strong> informe aqui o <strong>mesmo e-mail</strong> que você vai usar no momento do pagamento para liberar o acesso Premium automaticamente.
            </div>

            <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="email" placeholder="seuemail@exemplo.com">

                <label for="senha">Senha</label>
                <input type="password" id="senha" required autocomplete="current-password" placeholder="Mínimo 6 caracteres">

                <div id="campo-cpf" style="display: none;">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00">
                </div>

                <button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>
                <button type="submit" class="btn-entrar" id="btn-cadastrar" style="display: none;">Criar minha conta</button>
                <button type="button" class="btn-cadastrar" id="btn-ir-criar">Criar minha conta</button>
                <button type="button" class="btn-cadastrar" id="btn-ir-login" style="display: none;">Já tenho conta — Entrar</button>

                <p class="mensagem" id="mensagem"></p>
            </form>

            <a href="acesso-premium.html" style="display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--cor-texto-mutado); text-decoration: none;">
                Ainda não tem acesso às matérias pagas? Ver planos
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://kulaumnlntcepiikqpts.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1bGF1bW5sbnRjZXBpaWtxcHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNDU2NDMsImV4cCI6MjA5OTkyMTY0M30.GFPptPiuy1TEao-_n_GQVlfvX7R4gDwTaY8h1ZxU76s";

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById("form-login");
        const emailInput = document.getElementById("email");
        const senhaInput = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");
        const btnEntrar = document.getElementById("btn-entrar");
        const btnCadastrar = document.getElementById("btn-cadastrar");
        const cpfInput = document.getElementById("cpf");
        const campoCpf = document.getElementById("campo-cpf");
        const avisoCadastro = document.getElementById("aviso-cadastro");
        const titulo = document.getElementById("titulo");
        const subtitulo = document.getElementById("subtitulo");
        const btnIrCriar = document.getElementById("btn-ir-criar");
        const btnIrLogin = document.getElementById("btn-ir-login");

        // Lê "?redirect=..." com validação estrita (aceita apenas arquivos .html locais do próprio site)
        const params = new URLSearchParams(window.location.search);
        const redirectParam = params.get("redirect");
        const DESTINO_APOS_LOGIN = (redirectParam && /^[a-zA-Z0-9_-]+\.html$/.test(redirectParam))
            ? redirectParam
            : "index.html";

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = "mensagem " + (tipo || "");
        }

        function traduzirErroLogin(err) {
            const msg = (err && err.message) ? String(err.message) : "";
            const low = msg.toLowerCase();
            if (low.includes("email not confirmed")) {
                return "Seu e-mail ainda não foi confirmado. Verifique sua caixa de entrada (e o spam) e clique no link de confirmação antes de entrar.";
            }
            if (low.includes("invalid login credentials")) {
                return "E-mail ou senha incorretos. Confira os dados digitados (sem espaços extras).";
            }
            if (low.includes("too many requests") || low.includes("rate limit")) {
                return "Muitas tentativas seguidas. Aguarde alguns instantes e tente novamente.";
            }
            return msg ? ("Não foi possível entrar: " + msg) : "E-mail ou senha incorretos.";
        }

        function traduzirErroCadastro(err) {
            const msg = (err && err.message) ? String(err.message) : "";
            const low = msg.toLowerCase();
            if (low.includes("database error")) {
                return "Este CPF já está cadastrado em outra conta.";
            }
            if (low.includes("already registered") || low.includes("already been registered")) {
                return "Este e-mail já possui conta. Clique em 'Já tenho conta — Entrar' abaixo.";
            }
            return msg || "Não foi possível criar a conta. Tente novamente.";
        }

        function cpfValido(cpf) {
            cpf = cpf.replace(/\D/g, "");
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            for (let t = 9; t < 11; t++) {
                let soma = 0;
                for (let i = 0; i < t; i++) soma += Number(cpf[i]) * (t + 1 - i);
                const dig = ((soma * 10) % 11) % 10;
                if (dig !== Number(cpf[t])) return false;
            }
            return true;
        }

        // Máscara visual de CPF enquanto digita (000.000.000-00)
        cpfInput.addEventListener("input", function () {
            let v = cpfInput.value.replace(/\D/g, "").slice(0, 11);
            if (v.length > 9) {
                v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
            } else if (v.length > 6) {
                v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
            } else if (v.length > 3) {
                v = v.replace(/(\d{3})(\d{1,3})/, "$1.$2");
            }
            cpfInput.value = v;
        });

        // Se o aluno já estiver logado, redireciona direto para o destino (index.html ou acesso-premium.html)
        client.auth.getSession().then(({ data }) => {
            if (data && data.session) {
                window.location.href = DESTINO_APOS_LOGIN;
            }
        });

        // Dois modos na MESMA tela (o que o aluno já digitou não se perde): "login" e "criar"
        let modo = "login";

        function definirModo(novoModo) {
            modo = novoModo;
            const criar = (modo === "criar");
            titulo.textContent = criar ? "Crie sua conta" : "Acesse sua conta";
            subtitulo.textContent = criar
                ? "Preencha e-mail, senha e CPF para continuar"
                : "Entre com seu e-mail e senha";
            campoCpf.style.display = criar ? "block" : "none";
            avisoCadastro.style.display = criar ? "block" : "none";
            cpfInput.required = criar;
            btnEntrar.style.display = criar ? "none" : "";
            btnCadastrar.style.display = criar ? "" : "none";
            btnIrCriar.style.display = criar ? "none" : "";
            btnIrLogin.style.display = criar ? "" : "none";
            senhaInput.setAttribute("autocomplete", criar ? "new-password" : "current-password");
            mostrarMensagem("", "");
            if (criar && emailInput.value && senhaInput.value) cpfInput.focus();
        }

        btnIrCriar.addEventListener("click", () => definirModo("criar"));
        btnIrLogin.addEventListener("click", () => definirModo("login"));

        // Ao clicar em "1️⃣ Criar minha conta grátis" em acesso-premium.html, já abre com CPF visível
        if (params.get("criar") === "1") {
            definirModo("criar");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (modo === "login") {
                btnEntrar.disabled = true;
                mostrarMensagem("Entrando...", "");

                const { error } = await client.auth.signInWithPassword({
                    email: emailInput.value.trim(),
                    password: senhaInput.value
                });

                btnEntrar.disabled = false;

                if (error) {
                    console.error("Erro no login:", error);
                    mostrarMensagem(traduzirErroLogin(error), "erro");
                    return;
                }

                window.location.href = DESTINO_APOS_LOGIN;
                return;
            }

            // modo "criar"
            if (!emailInput.value.trim() || !senhaInput.value) {
                mostrarMensagem("Preencha e-mail e senha para criar a conta.", "erro");
                return;
            }
            if (senhaInput.value.length < 6) {
                mostrarMensagem("A senha precisa ter pelo menos 6 caracteres.", "erro");
                return;
            }
            if (!cpfValido(cpfInput.value)) {
                mostrarMensagem("Informe um CPF válido para criar a conta.", "erro");
                return;
            }

            btnCadastrar.disabled = true;
            mostrarMensagem("Criando conta...", "");

            const { data, error } = await client.auth.signUp({
                email: emailInput.value.trim(),
                password: senhaInput.value,
                options: { data: { cpf: cpfInput.value.replace(/\D/g, "") } }
            });

            btnCadastrar.disabled = false;

            if (error) {
                console.error("Erro no cadastro:", error);
                mostrarMensagem(traduzirErroCadastro(error), "erro");
                return;
            }

            // Se o Supabase já autenticar imediatamente após criar conta, redireciona direto
            if (data && data.session) {
                window.location.href = DESTINO_APOS_LOGIN;
                return;
            }

            mostrarMensagem(
                "Conta criada! Verifique seu e-mail para confirmar o cadastro e depois clique em 'Já tenho conta — Entrar' para finalizar o pagamento.",
                "sucesso"
            );
        });
    </script>
</body>

</html>
